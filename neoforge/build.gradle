dependencies {
    implementation project(':common')
    compileOnly('net.neoforged.fancymodloader:loader:12.0.12') { transitive = false }
    compileOnly('net.neoforged:mergetool:2.0.7:api') { transitive = false }
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

tasks.named('jar') {
    archiveBaseName = 'nvk-bridge-neoforge-26.3'
    from project(':common').sourceSets.main.output
}

tasks.named('sourcesJar') {
    from project(':common').sourceSets.main.allSource
}
