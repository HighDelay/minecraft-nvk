plugins {
    id 'base'
}

allprojects {
    group = 'dev.nvkbridge'
    version = '0.1.1'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
        // All targets are unobfuscated and the only Mixin uses remap=false.
        options.compilerArgs.add('-proc:none')
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) { rename { 'LICENSE' } }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging { events 'failed', 'skipped' }
    }
}

tasks.register('collectMods', Sync) {
    dependsOn ':fabric:jar', ':neoforge:jar'
    from project(':fabric').tasks.named('jar')
    from project(':neoforge').tasks.named('jar')
    into layout.projectDirectory.dir('dist')
    doLast {
        def destination = layout.projectDirectory.dir('dist').asFile
        def checksums = fileTree(destination).matching { include '*.jar' }.files.sort { it.name }.collect { artifact ->
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex()
            "${digest}  ${artifact.name}"
        }
        new File(destination, 'SHA256SUMS').setText(checksums.join('\n') + '\n', 'UTF-8')
    }
}

tasks.named('build') {
    dependsOn ':common:check', ':fabric:build', ':neoforge:build', 'collectMods'
}
